past:'「过去导向型时间感」（Boroditsky时间认知研究，2001）——你对「已经发生的、已经失去的」有深切的情感重量。这种时间感和{L}的文化世界有内在共鸣：很多你将接触到的表达和文学都建立在对「曾经」的精细感知上——你不需要翻译就能在直觉上感受到它的重量。',
pres:'「当下导向型时间感」（Boroditsky时间认知研究，2001）——你活在此刻，感受力强于规划力。语言是在「此刻想说这句话」的冲动里学会的，不是在「我以后会用到它」的计划里学会的。让你的当下驱动学习{L}的节奏——不必为没有长期计划而焦虑。',

ex:[['Weltschmerz','因现实与理想差距而生的深层哲学式痛苦','比「悲天悯人」更精确——是「世界本不该如此」这种感知本身带来的特定痛苦，中文无法一词表达。'],['Verschlimmbessern','越想改善越弄得更糟（这是一个动词）','中文需要整句话说清「好心把事情搞砸」，德语用一个合成词搞定——逻辑密度的极致体现。'],['Fingerspitzengefühl','对微妙情况的直觉性精准把握','字面是「指尖感」，实际是难以言说的细腻感知力——德语把抽象能力物化为身体感知。']],

nr:'你天然关注「谁需要被看见」「当前关系氛围是否对」，说明「颞顶联合区（TPJ）」——负责社会推理和他人视角模拟的脑区——可能比一般人更活跃。研究发现TPJ活跃程度与习得韩语敬语体系的速度直接相关（Yoo et al., 2019）——韩语要求你时刻感知关系层级，这正是你已经在做的事。',
ex:[['눈치（nunchi）','不需言语就能读懂氛围和他人感受的能力','中文没有专门命名「读氛围能力」的词——韩语将这种能力视为独立技能，体现了它在韩国文化中的核心地位。'],['정（jeong）','在长期相处中自然生长出的特殊依恋感','不是爱不是友情，是比两者都更难说清楚的「时间积淀的连接」——中文需要一整段话才能解释。'],['눈물겹다','让人泪水盈眶却还未落下的感动','精确描述「眼眶湿润但泪未落」的状态——情感颗粒度达到了毫米级别。']],

ex:[['طرب（tarab）','因音乐产生的极致情感共鸣，接近出神','不只是「喜欢」——是音乐触发接近灵魂震动的状态，中文没有描述「音乐带来灵魂出窍感」的专词。'],['يسعد صباحك','愿你的早晨幸福（回应早安的方式）','中文「早安」是陈述，阿拉伯语问候是「诗意祝愿」——整个打招呼体系建立在「愿望」上，而非功能性信息交换。'],['ما شاء الله','赞美时用来避免嫉妒之眼的祷语','同时包含赞美、感恩和文化防御——复杂文化逻辑浓缩在一句话里，无中文等价物。']],
ac:['先学三辅音词根系统：掌握50个词根等于同时学了数百个词，你的大脑会在这里找到「发现血缘关系」的愉悦。','用古兰经诵读音频建立语感——阿拉伯语的音律美是独一无二的，让耳朵先爱上它。','选「现代标准阿拉伯语」（MSA）作入门路径，可在22个国家通用。'],

nr:'你对细节和深度的持续关注说明可能有更强的「感知精细化倾向」。Winawer等（2007）发现俄语母语者视觉皮层对蓝色边界的神经反应更快，因为俄语区分浅蓝（голубой）和深蓝（синий）——语言直接重塑感知神经回路的铁证，你对细节的本能敏感正是这门语言最宝贵的学习起点。',
ex:[['Тоска（toska）','无法归因的深层渴望，灵魂的不安','Nabokov说英文里没有对应词——比「忧愁」更深，是一种没有对象的「灵魂渴望」，中文的「愁」接近但不够深。'],['Авось','对某种说不清好运的信任，一种命运感','类似「也许命运会眷顾」，但带着俄式「豁出去了」的壮烈感——中文的「随缘」太平静。'],['Надрыв','情感过载到即将崩溃前的极度紧绷','陀思妥耶夫斯基最爱用这个词——不是崩溃，是即将崩溃前的临界状态，情感被拉伸到极限的那一刻。']],

nr:'你对「已经过去的」或「可能永不会来的」事物的深切感受说明「海马体-奖励回路」在「怀旧感」状态下有更强的激活——Sedikides研究发现这种神经状态与创造性联想能力高度重叠。葡萄牙语的核心情感saudade是一种时间观：爱着那已不在的，你能理解这种感受说明你已拥有理解这门语言最深处的能力。',
ex:[['Saudade','对某个已失去或可能永不存在之物的深切思念','没有语言能完全翻译它——「乡愁」太具体，「惆怅」太泛，它是「爱着那已不在的」的特殊状态。'],['Desenrascanço','在困境中临时发明出一个有效但略混乱的解决方案','类似「临时抱佛脚」，但带着骄傲感——葡萄牙语把「乱中生智」命名为值得自豪的积极能力。'],['Madrugada','深夜到黎明间那段时间（带有孤独和哲学意味）','Fado音乐诞生在这个时段的情绪里——比西班牙语版本多了一层「在深夜独自存在」的存在感。']],

ex:[['เกรงใจ（kreng jai）','体贴到不愿给对方添麻烦，有时压抑真实想法','中文有「不好意思」，但kreng jai更深——是预防性的「不打扰」，关系敏感度高到有时阻碍自我表达。'],['สนุก（sanuk）','把享受和乐趣注入几乎所有活动的生活哲学','不只是「好玩」——泰国文化认为任何事都应有sanuk，是把「享乐感」内嵌进存在本身的世界观。'],['ไม่เป็นไร（mai pen rai）','没关系——一种超然的释然哲学','表面是「没关系」，实际包含「执念无益」的整套哲学——中文的「算了」有放弃感，mai pen rai是真正的超然。']],

ex:[['Meraki','全心全意投入某事，把灵魂注入其中','不只是「用心」——meraki是「这件事里有我的灵魂」，强调创作者与作品的融合，中文最近的「匠心」缺少情感色彩。'],['Philotimo','荣誉感、慷慨、对他人责任感的综合体','希腊文化最重要的概念之一——不是「有面子」，是「做一个值得尊重的人」的内在驱动，无法用一个中文词翻译。'],['Kefi','因音乐、舞蹈、喜悦而产生的集体狂喜','是一群人因共同音乐而短暂「成为同一个东西」的状态——西班牙语的duende是个人版本，kefi是集体版本。']],

var N=QS.length;
var cur=0,ans=Array(N).fill(null);
document.getElementById('ptot').textContent=N;

function show(id){document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function startQ(){cur=0;ans=Array(N).fill(null);loadQ(0);show('p1');}
function restart(){show('p0');}

function loadQ(n){
  document.getElementById('qnum').textContent='Q'+String(n+1).padStart(2,'0')+' / '+N;
  document.getElementById('qtext').textContent=QS[n].q;
  document.getElementById('pf').style.width=Math.round((n+1)/N*100)+'%';
  document.getElementById('pnum').textContent=n+1;
  document.getElementById('hint').textContent=n>=19?'💡 这几题关于你的学习方式，没有好坏之分':'☕ 选第一感觉，不要选「应该怎样」的答案';
  var el=document.getElementById('opts');el.innerHTML='';
  QS[n].o.forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'+(ans[n]===o[0]?' sel':'');
    b.dataset.v=o[0];
    b.innerHTML='<span class="ol">'+o[0]+'</span>'+o[1];
    b.onclick=function(){pick(o[0]);};
    el.appendChild(b);
  });
  var bP=document.getElementById('bP');
  bP.disabled=n===0;bP.style.opacity=n===0?'0.4':'1';
  document.getElementById('bN').textContent=n===N-1?'看结果 →':'下一页 →';
}

function pick(v){
  ans[cur]=v;
  document.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('sel',b.dataset.v===v);});
}
function nextQ(){if(cur>=N-1){calc();return;}cur++;loadQ(cur);}
function prevQ(){if(cur>0){cur--;loadQ(cur);}}

function cos(a,b){var d=0,na=0,nb=0;for(var i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return(na&&nb)?d/(Math.sqrt(na)*Math.sqrt(nb)):0;}

// ===== 2026-11-03 计分校准 =====
// 一般人基准：按 16Personalities 中国类型比例（2025-10~2026-09）模拟 4000 份答卷得出，与旅游测试同一做法。
// 维度→MBTI 轴（编辑假设）：细节/务实→S，隐喻→N，逻辑/系统→T，情感/集体共情→F，社会感知→E，内省→I，音韵→无关。
// 有真人试答数据后，用真实答卷重算 BASE_M / BASE_SD / LBIAS。
var BASE_M=[4.842, 4.674, 5.022, 5.105, 3.825, 3.527, 7.612, 2.277, 7.212, 5.684];
var BASE_SD=[4.237, 4.979, 3.737, 4.525, 4.054, 2.17, 5.016, 2.258, 4.436, 4.556];
// 各语言校准偏移（强度 0.8）：让一般人测出各语言的机会接近，同时答得鲜明的人仍能测回对应语言
var LBIAS={"JPN": 0.036, "FRE": 0.152, "ESP": -0.149, "GER": -0.072, "KOR": -0.13, "ARA": -0.031, "RUS": 0.044, "POR": -0.092, "ITA": 0.031, "THA": 0.099, "TUR": -0.049, "GRE": 0.051, "VIE": 0.086, "SWE": -0.046, "HEB": 0.018, "FIN": 0.053};
// 同分时用相关维度的相对得分来分，而不是按排列顺序
var CT_TIE={Ph:'T',Gr:'L',Ind:'Y',Mc:'M'};
var TP_TIE={past:'I',pres:'E',fut:'Y',cyc:'M'};
function zvec(uv){return uv.map(function(v,i){return (v-BASE_M[i])/BASE_SD[i];});}
function ctr(v){var a=v.reduce(function(x,y){return x+y;},0)/v.length;return v.map(function(x){return x-a;});}
function lscore(z,L){return cos(z,ctr(L.v))+(LBIAS[L.k]||0);}
function pickKey(obj,tie,z){return Object.keys(obj).reduce(function(a,b){
  if(obj[b]!==obj[a])return obj[b]>obj[a]?b:a;
  return z[DK.indexOf(tie[b])]>z[DK.indexOf(tie[a])]?b:a;});}

function calc(){
  var uv=Array(10).fill(0),cv={Ph:0,Gr:0,Ind:0,Mc:0},es=0,tp={past:0,pres:0,fut:0,cyc:0};
  QS.forEach(function(q,i){
    if(!ans[i])return;
    var o=q.o.find(function(x){return x[0]===ans[i];});
    if(!o||!o[2])return;
    Object.keys(o[2]).forEach(function(k){
      var idx=DK.indexOf(k);
      if(idx>=0)uv[idx]+=o[2][k];
      else if(cv.hasOwnProperty(k))cv[k]+=o[2][k];
      else if(k==='ES')es+=o[2][k];
      else if(tp.hasOwnProperty(k))tp[k]+=o[2][k];
    });
  });
  var z=zvec(uv);
  var ctK=pickKey(cv,CT_TIE,z);
  var esK=es>1?'E':es<-1?'S':'B';
  var tpK=pickKey(tp,TP_TIE,z);
  var ranked=LANGS.slice().sort(function(a,b){return lscore(z,b)-lscore(z,a);});
  render(ranked[0],ranked.slice(1,5),z,ctK,esK,tpK);
  show('p2');
}

function bdg(t){return '<span class="bdg">'+t+'</span>';}
function card(id,lbl,html){document.getElementById(id).innerHTML='<div class="cl">'+lbl+'</div><div class="ct">'+html+'</div>';}

function render(L,oth,uv,ctK,esK,tpK){
  function ft(s){return s.replace(/\{L\}/g,L.n);}
  document.getElementById('rH').innerHTML='<div class="rf">'+L.f+'</div><div class="rn">'+L.n+'</div><div class="rt">「'+L.t+'」</div>';
  card('rG','你的'+L.n+'基因',L.nr);
  card('rC','🎯 你的习得风格'+bdg(CTlb[ctK]),ft(CTtx[ctK]));
  card('rE','🧩 你的认知类型'+bdg(ESlb[esK]),ft(EStx[esK]));
  card('rT','⏳ 你的时间感'+bdg(TPlb[tpK]),ft(TPtx[tpK]));
  var xH='<div class="cl">🔤 这门语言里中文没有的词</div>';
  L.ex.forEach(function(e,i){xH+='<div class="ei'+(i===L.ex.length-1?' last':'')+'" style="'+(i===L.ex.length-1?'margin:0;padding:0;border:none':'')+'"><div class="ew">'+e[0]+'</div><div class="em">'+e[1]+'</div><div class="ey">'+e[2]+'</div></div>';});
  document.getElementById('rX').innerHTML=xH;
  var dH='<div class="cl">📊 你的认知维度 Top 5</div>';
  uv.map(function(v,i){return{n:DN[i],v:v};}).sort(function(a,b){return b.v-a.v;}).slice(0,5).forEach(function(d){
    var p=Math.round(Math.max(0.08,Math.min(1,(d.v+2)/4))*88);
    dH+='<div class="bi"><div class="bn">'+d.n+'</div><div class="bk"><div class="bf" data-p="'+p+'"></div></div><div class="bv">'+p+'</div></div>';
  });
  document.getElementById('rD').innerHTML=dH;
  var ms=Math.max.apply(null,oth.map(function(l){return lscore(uv,l)+1;}).concat([0.001]));
  var oH='<div class="cl">🌍 最接近你的其他语言</div>';
  oth.forEach(function(l){var p=Math.round((lscore(uv,l)+1)/ms*82);oH+='<div class="bi"><div class="bn" style="width:80px">'+l.f+' '+l.n+'</div><div class="bk"><div class="bg" data-p="'+p+'"></div></div><div class="bv">'+p+'</div></div>';});
  document.getElementById('rO').innerHTML=oH;
  var aH='<div class="cl">📚 专属入门建议</div>';
  L.ac.forEach(function(a,i){aH+='<div class="ti"><div class="tn">'+(i+1)+'</div><div>'+a+'</div></div>';});
  document.getElementById('rA').innerHTML=aH;
  setTimeout(function(){document.querySelectorAll('.bf,.bg').forEach(function(el){el.style.width=el.dataset.p+'%';});},150);
}
</script>
